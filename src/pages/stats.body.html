<!--
title: Site Statistics | Yinor Coffee
desc: Yinor Coffee website visitor statistics.
ogimage: /assets/img/hero-home.jpg
-->
<section class="page-hero">
  <div class="container">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Home</a> &rsaquo; Statistics</nav>
    <h1>Site Visitor Statistics</h1>
    <p class="lead">Daily visitors, countries and devices for yinorcoffee.com.</p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:860px;">
    <div id="stats" style="background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);">
      <p>Loading statistics...</p>
    </div>
    <p class="mt-2" style="color:var(--muted);font-size:0.85rem;">Private page - bookmark the URL. Data is anonymous (country/device/pages only).</p>
  </div>
</section>

<script>
(function () {
  var countryNames = {
    US: 'United States', GB: 'United Kingdom', DE: 'Germany', FR: 'France', NL: 'Netherlands',
    CN: 'China', JP: 'Japan', KR: 'South Korea', SG: 'Singapore', MY: 'Malaysia', TH: 'Thailand',
    AU: 'Australia', NZ: 'New Zealand', CA: 'Canada', BR: 'Brazil', MX: 'Mexico', IN: 'India',
    AE: 'UAE', SA: 'Saudi Arabia', TR: 'Turkey', ES: 'Spain', IT: 'Italy', RU: 'Russia',
    UA: 'Ukraine', PL: 'Poland', SE: 'Sweden', CH: 'Switzerland', HK: 'Hong Kong', TW: 'Taiwan',
    VN: 'Vietnam', ID: 'Indonesia', PH: 'Philippines', IE: 'Ireland', AT: 'Austria', BE: 'Belgium'
  };
  function name(c) { return countryNames[c] || c; }
  var el = document.getElementById('stats');
  fetch('/.netlify/functions/visits').then(function (r) { return r.json(); }).then(function (data) {
    if (!data.days || data.days.length === 0) {
      el.innerHTML = '<p>No visits recorded yet.</p>';
      return;
    }
    var total = 0, countries = {}, devices = {}, pages = {}, referrers = {};
    data.days.forEach(function (d) {
      total += d.views;
      Object.keys(d.countries || {}).forEach(function (c) { countries[c] = (countries[c] || 0) + d.countries[c]; });
      Object.keys(d.devices || {}).forEach(function (x) { devices[x] = (devices[x] || 0) + d.devices[x]; });
      Object.keys(d.pages || {}).forEach(function (p) { pages[p] = (pages[p] || 0) + d.pages[p]; });
      Object.keys(d.referrers || {}).forEach(function (r) { referrers[r] = (referrers[r] || 0) + d.referrers[r]; });
    });
    var rows = data.days.slice().reverse().map(function (d) {
      var top = Object.keys(d.pages || {}).slice(0, 3).map(function (p) { return p + ' (' + d.pages[p] + ')'; }).join(', ');
      return '<tr><td>' + d.date + '</td><td>' + d.views + '</td><td>' + top + '</td></tr>';
    }).join('');
    var cRows = Object.keys(countries).sort(function (a, b) { return countries[b] - countries[a]; }).map(function (c) {
      return '<tr><td>' + name(c) + '</td><td>' + countries[c] + '</td></tr>';
    }).join('');
    var dRows = Object.keys(devices).map(function (x) {
      return '<tr><td>' + x + '</td><td>' + devices[x] + '</td></tr>';
    }).join('');
    var pRows = Object.keys(pages).sort(function (a, b) { return pages[b] - pages[a]; }).slice(0, 10).map(function (p) {
      return '<tr><td>' + p + '</td><td>' + pages[p] + '</td></tr>';
    }).join('');
    var refRows = Object.keys(referrers).sort(function (a, b) { return referrers[b] - referrers[a]; }).slice(0, 10).map(function (r) {
      return '<tr><td>' + r + '</td><td>' + referrers[r] + '</td></tr>';
    }).join('');
    var html = '<h3 style="margin-bottom:14px;">Total visits recorded: ' + total + '</h3>';
    html += '<h4 style="margin:18px 0 8px;">By Country</h4><table class="spec-table" style="margin:0 0 8px;"><tr><th>Country</th><th>Visits</th></tr>' + cRows + '</table>';
    html += '<h4 style="margin:18px 0 8px;">By Device</h4><table class="spec-table" style="margin:0 0 8px;"><tr><th>Device</th><th>Visits</th></tr>' + dRows + '</table>';
    html += '<h4 style="margin:18px 0 8px;">Top Pages</h4><table class="spec-table" style="margin:0 0 8px;"><tr><th>Page</th><th>Views</th></tr>' + pRows + '</table>';
    html += '<h4 style="margin:18px 0 8px;">Source Websites (Referrers)</h4><table class="spec-table" style="margin:0 0 8px;"><tr><th>Source</th><th>Visits</th></tr>' + (refRows || '<tr><td>Direct / unknown</td><td>-</td></tr>') + '</table>';
    html += '<h4 style="margin:18px 0 8px;">Daily</h4><table class="spec-table" style="margin:0;"><tr><th>Date</th><th>Visits</th><th>Top Pages</th></tr>' + rows + '</table>';
    el.innerHTML = html;
  }).catch(function () {
    el.innerHTML = '<p>Could not load statistics.</p>';
  });
})();
</script>
