  <script>
    // Redirect Netlify Identity confirm/recovery/invite links to the CMS admin
    (function () {
      try {
        var isAdmin = window.location.pathname.indexOf('/admin') !== -1;
        if (!isAdmin) {
          var q = window.location.search || '';
          var h = window.location.hash || '';
          var hasQToken = q.indexOf('token=') !== -1 && q.indexOf('type=') !== -1;
          var hasHToken = h.indexOf('recovery_token=') !== -1 || h.indexOf('confirmation_token=') !== -1 || h.indexOf('invite_token=') !== -1;
          if (hasQToken || hasHToken) {
            window.location.replace('/admin/' + h);
          }
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <script>
    // Visitor tracking (Netlify Function + Blobs)
    (function () {
      if (window.location.pathname.indexOf('/admin') !== -1) return;
      try {
        var ref = document.referrer || '';
        var refHost = '';
        try { refHost = ref ? new URL(ref).hostname : ''; } catch (e) { refHost = ref; }
        fetch('/.netlify/functions/visits', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: window.location.pathname, referrer: refHost }),
          keepalive: true
        });
      } catch (e) { /* ignore */ }
    })();
  </script>
