# Yinor Coffee - Decap CMS configuration
# Login at https://yinorcoffee.com/admin/ (requires Netlify Identity + Git Gateway)

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "CMS: create {{collection}} {{slug}}"
    update: "CMS: update {{collection}} {{slug}}"
    delete: "CMS: delete {{collection}} {{slug}}"
    uploadMedia: "CMS: upload {{file}}"
    deleteMedia: "CMS: delete {{file}}"

media_folder: "assets/img"
public_folder: "/assets/img"

publish_mode: editorial_workflow

collections:
  - name: "pages"
    label: "页面 (Pages)"
    files:
      - name: "home"
        label: "首页 Homepage"
        file: "src/pages/index.body.html"
        frontmatter_delimiter: ["<!--", "-->"]
        fields:
          - { label: "SEO 标题", name: title, widget: string }
          - { label: "Meta 描述", name: desc, widget: text }
          - { label: "分享图片", name: ogimage, widget: image }
          - { label: "页面内容", name: body, widget: text, editor: { preview: false } }
      - name: "catalog"
        label: "产品目录 All Products"
        file: "src/pages/premium-espresso-blends-coffee-beans.body.html"
        frontmatter_delimiter: ["<!--", "-->"]
        fields:
          - { label: "SEO 标题", name: title, widget: string }
          - { label: "Meta 描述", name: desc, widget: text }
          - { label: "分享图片", name: ogimage, widget: image }
          - { label: "页面内容", name: body, widget: text, editor: { preview: false } }
      - name: "about"
        label: "关于我们 About"
        file: "src/pages/about-us-coffee-beans.body.html"
        frontmatter_delimiter: ["<!--", "-->"]
        fields:
          - { label: "SEO 标题", name: title, widget: string }
          - { label: "Meta 描述", name: desc, widget: text }
          - { label: "分享图片", name: ogimage, widget: image }
          - { label: "页面内容", name: body, widget: text, editor: { preview: false } }
      - name: "contact"
        label: "询价页 Contact/Inquiry"
        file: "src/pages/request-a-consultation-coffee-wholesale-inquiry.body.html"
        frontmatter_delimiter: ["<!--", "-->"]
        fields:
          - { label: "SEO 标题", name: title, widget: string }
          - { label: "Meta 描述", name: desc, widget: text }
          - { label: "分享图片", name: ogimage, widget: image }
          - { label: "页面内容", name: body, widget: text, editor: { preview: false } }

  - name: "categories"
    label: "类别页 (Categories)"
    files:
      - name: "regular"
        label: "Regular Espresso Blends"
        file: "src/pages/regular-espresso-blends-coffee-beans.body.html"
        frontmatter_delimiter: ["<!--", "-->"]
        fields:
          - { label: "SEO 标题", name: title, widget: string }
          - { label: "Meta 描述", name: desc, widget: text }
          - { label: "页面内容", name: body, widget: text, editor: { preview: false } }
      - name: "premium"
        label: "Premium Espresso Blends"
        file: "src/pages/premium-espresso-coffee-beans.body.html"
        frontmatter_delimiter: ["<!--", "-->"]
        fields:
          - { label: "SEO 标题", name: title, widget: string }
          - { label: "Meta 描述", name: desc, widget: text }
          - { label: "页面内容", name: body, widget: text, editor: { preview: false } }
      - name: "soe"
        label: "Single Origin (SOE)"
        file: "src/pages/single-origin-espresso-soe-coffee-beans.body.html"
        frontmatter_delimiter: ["<!--", "-->"]
        fields:
          - { label: "SEO 标题", name: title, widget: string }
          - { label: "Meta 描述", name: desc, widget: text }
          - { label: "页面内容", name: body, widget: text, editor: { preview: false } }

  - name: "products"
    label: "产品 (Products)"
    label_singular: "产品"
    folder: "src/products"
    create: true
    extension: body.html
    format: yaml-frontmatter
    frontmatter_delimiter: ["<!--", "-->"]
    slug: "{{slug}}"
    fields:
      - { label: "SEO 标题", name: title, widget: string }
      - { label: "Meta 描述", name: desc, widget: text }
      - { label: "产品图片", name: ogimage, widget: image }
      - { label: "产品名称", name: pname, widget: string }
      - { label: "分类", name: category, widget: select, options: ["regular", "premium", "soe"] }
      - { label: "风味简介", name: flavor, widget: string }
      - { label: "产品内容", name: body, widget: text, editor: { preview: false } }

  - name: "posts"
    label: "博客文章 (Blog Posts)"
    label_singular: "文章"
    folder: "src/posts"
    create: true
    extension: body.html
    format: yaml-frontmatter
    frontmatter_delimiter: ["<!--", "-->"]
    slug: "{{slug}}"
    fields:
      - { label: "SEO 标题", name: title, widget: string }
      - { label: "Meta 描述", name: desc, widget: text }
      - { label: "发布日期", name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: "分享图片", name: ogimage, widget: image }
      - { label: "文章内容", name: body, widget: text, editor: { preview: false } }
